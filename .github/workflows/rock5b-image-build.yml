name: Rock 5B image build

# Self-contained HAOS image build for the Radxa Rock 5B (RK3588), so the fork can
# produce flashable images without the private desmond-dong/haos-cn-scripts repo
# or any secret. It follows upstream home-assistant/operating-system's own build
# flow (.github/workflows/build.yaml): assemble the build tree, build the
# haos-builder container locally from upstream's Dockerfile, then run Buildroot
# inside it with --privileged (loop devices are needed for the data partition).
#
# STAGES (workflow_dispatch input, so the port is validated step by step). A full
# HAOS build does not fit in one 6-hour run on a standard 2-core runner, so the
# expensive part is split into cumulative stages that carry state through ccache
# (restore-keys also pick up upstream's haos-cc-rock5b cache):
#   config      assemble + `make rock5b_defconfig` + audit the resolved .config
#               (minutes; catches missing package registrations, dropped symbols,
#               bad .hash files and fragment problems before paying for a build)
#   packages    config + every userspace package, incl. the five Rock 5B ones
#               (toolchain, rockchip-mpp, librga, librknnrt, rknpu's host deps,
#               ffmpeg-rockchip, hassio containers)
#   kernel      packages + linux (Image + rk3588-rock-5b.dtb via Buildroot, which
#               applies patches/linux and the HAOS fragment chain) + rknpu.ko
#   full        everything: bootloader, rootfs, the RAUC-signed disk image,
#               linux-check-dotconfig and the image artifact upload
#
# A push to rock5b-port runs `config`, unless the commit message selects another
# stage with [stage:packages] / [stage:kernel] / [stage:full] (or the [full]
# shorthand), so regressions in the external tree are caught without burning hours.
#
# The CN-specific bits that haos.sh normally injects are not needed for rock5b:
# this tree ships its own Config.in / external.mk / external.desc, and the only
# defconfig symbol it cannot resolve is BR2_PACKAGE_RTL8821CU (a private HAOS-CN
# package); it is reported as a warning instead of failing the build.
#
# DEBUG WITHOUT A TOKEN: fork job logs need admin rights, but check-run
# annotations do not, so every failure path re-emits the real cause as ::error::.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Build stage'
        required: true
        type: choice
        default: config
        options:
          - config
          - packages
          - kernel
          - full
      upstream_ref:
        description: 'home-assistant/operating-system ref to build against'
        required: true
        default: '18.5'
  push:
    branches: [rock5b-port]
    paths:
      - 'buildroot-external/**'
      - '.github/workflows/rock5b-image-build.yml'

concurrency:
  group: rock5b-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish the image to the fixed rock5b-dev release tag

env:
  UPSTREAM_REPO: https://github.com/home-assistant/operating-system.git

jobs:
  build:
    name: Rock 5B image (${{ inputs.stage || (contains(github.event.head_commit.message, '[stage:packages]') && 'packages' || contains(github.event.head_commit.message, '[stage:kernel]') && 'kernel' || contains(github.event.head_commit.message, '[stage:full]') && 'full' || contains(github.event.head_commit.message, '[full]') && 'full' || 'config') }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # No PAT is available on this fork, so workflow_dispatch cannot be triggered
      # by the API: a push whose commit message carries [stage:<name>] selects the
      # stage instead (and [full] is kept as a shorthand).
      STAGE: ${{ inputs.stage || (contains(github.event.head_commit.message, '[stage:packages]') && 'packages' || contains(github.event.head_commit.message, '[stage:kernel]') && 'kernel' || contains(github.event.head_commit.message, '[stage:full]') && 'full' || contains(github.event.head_commit.message, '[full]') && 'full' || 'config') }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || '18.5' }}
      RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
      RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
    steps:
      - name: Checkout HAOS-CN
        uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android/sdk /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/cache /mnt/output
          owner="$(stat -c '%U:%G' "${GITHUB_WORKSPACE}")"
          sudo chown -R "${owner}" /mnt/cache /mnt/output
          df -h

      - name: Assemble the build tree
        run: |
          set -euo pipefail
          # Upstream provides the buildroot submodule, scripts/, ota/, meta and the
          # upstream packages; this fork overlays its buildroot-external on top,
          # exactly like HAOS-CN's Builder.yml does (cp -r buildroot-external ...).
          git clone --quiet --depth 1 --branch "${UPSTREAM_REF}" "${UPSTREAM_REPO}" os-up
          git -C os-up submodule update --init --depth 1
          cp -a buildroot-external/. os-up/buildroot-external/
          for f in external.desc external.mk Config.in scripts/post-image.sh \
                   configs/rock5b_defconfig kernel/v6.18.y/kernel-arm64-rockchip.config \
                   board/radxa/rock5b/meta Dockerfile; do
            test -f "os-up/buildroot-external/${f}" 2>/dev/null || test -f "os-up/${f}" || {
              echo "::error::build tree is missing ${f}"; exit 1; }
          done
          echo "BUILD_TREE=${GITHUB_WORKSPACE}/os-up" >> "${GITHUB_ENV}"

      - name: Set development version suffix
        run: |
          set -euo pipefail
          cd "${BUILD_TREE}"
          version_dev="dev$(date --utc +'%Y%m%d')"
          sed -i -E "s/(^VERSION_SUFFIX=\").*(\"$)/\1${version_dev}\2/" buildroot-external/meta
          grep '^VERSION' buildroot-external/meta

      - name: Generate RAUC signing key
        run: |
          set -euo pipefail
          cd "${BUILD_TREE}"
          if [ -n "${RAUC_CERTIFICATE}" ] && [ -n "${RAUC_PRIVATE_KEY}" ]; then
            echo "Using the RAUC secrets from the repository settings."
            printf -- '-----BEGIN CERTIFICATE-----\n%s\n-----END CERTIFICATE-----\n' \
              "${RAUC_CERTIFICATE}" > cert.pem
            printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' \
              "${RAUC_PRIVATE_KEY}" > key.pem
          else
            echo "::warning::No RAUC_CERTIFICATE/RAUC_PRIVATE_KEY secrets; building with a public self-signed certificate (this image cannot OTA-update to a signed release)."
            buildroot-external/scripts/generate-signing-key.sh cert.pem key.pem
          fi
          test -s cert.pem && test -s key.pem

      - name: Build the haos-builder container image
        run: |
          set -euo pipefail
          cd "${BUILD_TREE}"
          docker build -t haos-builder:local . > /tmp/docker-build.log 2>&1 || {
            echo "::error::haos-builder image build failed:"; tail -n 40 /tmp/docker-build.log; exit 1; }
          tail -n 5 /tmp/docker-build.log

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: /mnt/cache/cc
          key: haos-cc-rock5b
          restore-keys: haos-cc-rock5b-

      - name: Generate build config (make rock5b_defconfig)
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" -e BUILDER_GID="$(id -g)" \
            -v "${BUILD_TREE}:/build" -v /mnt/cache:/cache -v /mnt/output:/build/output \
            haos-builder:local make rock5b_defconfig
          test -f /mnt/output/.config

      - name: Audit the resolved Buildroot config
        run: |
          set -uo pipefail
          cfg=/mnt/output/.config
          fail=0
          echo "--- board / image plumbing ---"
          for s in BR2_aarch64 BR2_LINUX_KERNEL BR2_PACKAGE_HOST_GENIMAGE BR2_TARGET_UBOOT \
                   BR2_PACKAGE_ROCKCHIP_BLOBS BR2_PACKAGE_HASSIO BR2_PACKAGE_OS_AGENT \
                   BR2_PACKAGE_RAUC; do
            grep -q "^${s}=y$" "${cfg}" || { echo "::error::${s} is not enabled ($(grep "^${s}=" "${cfg}" || echo unset))"; fail=1; }
          done
          echo "--- RK3588 media/AI packages ---"
          # Mandatory (kernel side): the rknpu out-of-tree module and the kernel
          # itself. The MPP/RGA drivers, Panthor (GPU) and pwm-fan + thermal
          # (fan control) are compiled INTO the kernel by
          # board/radxa/rock5b/kernel.config, so there is no package for them.
          for s in BR2_PACKAGE_RKNPU BR2_PACKAGE_LIBRKNNRT BR2_LINUX_KERNEL; do
            grep -q "^${s}=y$" "${cfg}" || {
              echo "::error::${s} was dropped, but the kernel-side RKNPU/GPU/fan support depends on it"; fail=1; }
          done
          # Userspace accelerators: nice to have, containers can bring their own
          # (see the board kernel.config note), so a drop is a warning, not an error.
          for s in BR2_PACKAGE_ROCKCHIP_MPP BR2_PACKAGE_LIBRGA BR2_PACKAGE_FFMPEG_ROCKCHIP; do
            if grep -q "^${s}=y$" "${cfg}"; then
              echo "ok    ${s}=y"
            else
              echo "::warning::${s} was dropped: it is set in configs/rock5b_defconfig but missing from the resolved .config (Config.in not sourced, unmet dependency, or stale symbol). Containers can provide this userspace instead."
            fi
          done
          echo "--- known-unavailable HAOS-CN symbols (private packages, tolerated) ---"
          for s in BR2_PACKAGE_RTL8821CU BR2_PACKAGE_AP6236_FIRMWARE \
                   BR2_PACKAGE_AP6256_FIRMWARE BR2_PACKAGE_MATTER; do
            grep -q "^${s}=y$" "${cfg}" || echo "::warning::${s}=y is requested by rock5b_defconfig but not set (private HAOS-CN package, absent from this self-contained tree)"
          done
          echo "--- kernel config chain ---"
          grep -E '^BR2_LINUX_KERNEL_(CUSTOM_VERSION_VALUE|CUSTOM_CONFIG_FILE|CONFIG_FRAGMENT_FILES|INTREE_DTS_NAME)=' "${cfg}" || true
          grep -q '^BR2_LINUX_KERNEL_INTREE_DTS_NAME="rockchip/rk3588-rock-5b"$' "${cfg}" || {
            echo "::error::kernel DTB name is not rockchip/rk3588-rock-5b"; fail=1; }
          exit "${fail}"

      - name: Build stage '${{ env.STAGE }}'
        if: env.STAGE != 'config'
        run: |
          set +e
          : > /tmp/build.log
          case "${STAGE}" in
            packages) targets="rockchip-mpp librga librknnrt ffmpeg-rockchip hassio host-tempio os-agent" ;;
            kernel)   targets="rockchip-mpp librga librknnrt ffmpeg-rockchip hassio host-tempio os-agent linux rknpu" ;;
            full)     targets="" ;;
            *) echo "::error::unknown stage '${STAGE}'"; exit 1 ;;
          esac
          echo "stage=${STAGE} make targets: ${targets:-<all>}"
          # shellcheck disable=SC2086
          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" -e BUILDER_GID="$(id -g)" \
            -v "${BUILD_TREE}:/build" -v /mnt/cache:/cache -v /mnt/output:/build/output \
            haos-builder:local bash -c "cd /build && make ${targets}" 2>&1 | tee -a /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "${rc}" -ne 0 ]; then
            echo "::error::Buildroot build FAILED at stage '${STAGE}' (rc=${rc}). The failing package and its real output are re-emitted below and kept in the build-log artifact."
            # Parallel `make` interleaves a concurrent package's wget progress
            # ("12345K .... 98% 109M") right before the dying package's error, so a
            # raw 90-line window is pure download noise. Two-step instead:
            #   1. Name the failing package from the "*** [output/build/<pkg>/.stamp_*] Error N"
            #      target line (Buildroot's pkg-generic stamps carry the package dir).
            #   2. Show that package's own output: every log line mentioning its build
            #      dir, with download-progress lines stripped.
            failpkg=$(grep -oE 'output/build/[A-Za-z0-9_.+-]+/\.stamp_[A-Za-z_]+' /tmp/build.log | tail -n 1)
            if [ -n "${failpkg}" ]; then
              pkgdir=$(echo "${failpkg}" | sed -E 's#output/build/([^/]+)/.*#\1#')
              echo "::error::Failing package: ${pkgdir} (target ${failpkg})"
              echo "===== lines mentioning ${pkgdir} (progress noise stripped) ====="
              grep -F "${pkgdir}" /tmp/build.log \
                | grep -vE '[0-9]+K \.+|[0-9]+% +[0-9.]+[KMG]' \
                | tail -n 80 | while IFS= read -r l; do echo "::error::${l}"; done
            fi
            # The pkgdir grep above misses root-cause lines that do not name the
            # build dir (e.g. "cp: cannot stat '/cache/dl/librknnrt.so'", wget
            # failures, "No space left on device", hash mismatches). The job log and
            # the build-log artifact both require auth to read on this fork, so
            # re-emit the real error lines as public annotations too.
            echo "===== real error lines (public, keyword-matched) ====="
            grep -vE '[0-9]+K \.+|[0-9]+% +[0-9.]+[KMG]' /tmp/build.log \
              | grep -iE 'cannot stat|No such file|No space left|wget:|ERROR:|[Hh]ash|checksum|Permission denied|tar:|Error [0-9]|\*\*\*|fatal|[Ff]ailed' \
              | tail -n 40 | while IFS= read -r l; do echo "::error::${l}"; done
            # Always also show the make error lines and a noise-stripped tail so the
            # actual compiler/linker failure is visible even if the stamp grep misses.
            echo "===== make error lines ====="
            grep -nE '\*\*\* \[|make(\[[0-9]+\])?: \*\*\*|Error [0-9]+$' /tmp/build.log \
              | grep -vE '[0-9]+K \.+|[0-9]+% +[0-9.]+[KMG]' | tail -n 20
            echo "===== build.log tail (noise-stripped, 120 lines) ====="
            grep -vE '[0-9]+K \.+|[0-9]+% +[0-9.]+[KMG]' /tmp/build.log | tail -n 120
            exit 1
          fi
          echo "Stage '${STAGE}' finished OK"

      - name: Assert stage artifacts
        if: env.STAGE != 'config'
        run: |
          set -uo pipefail
          fail=0
          want_kernel=0; want_img=0
          case "${STAGE}" in
            kernel|full) want_kernel=1 ;;
          esac
          [ "${STAGE}" = full ] && want_img=1
          if [ "${want_kernel}" = 1 ]; then
            for f in /mnt/output/build/linux-*/arch/arm64/boot/Image \
                     /mnt/output/build/linux-*/arch/arm64/boot/dts/rockchip/rk3588-rock-5b.dtb; do
              ls -la ${f} 2>/dev/null || { echo "::error::missing kernel artifact: ${f}"; fail=1; }
            done
            # The kernel-side pieces the port must ship: vendor MPP/RGA built in,
            # Panthor GPU, pwm-fan + thermal, and Rocket kept off for rknpu.
            kcfg=$(echo /mnt/output/build/linux-*/.config | awk '{print $1}')
            for s in CONFIG_ROCKCHIP_MPP_SERVICE CONFIG_ROCKCHIP_MPP_RKVENC2 \
                     CONFIG_ROCKCHIP_MPP_RKVDEC2 CONFIG_ROCKCHIP_MULTI_RGA \
                     CONFIG_DRM_PANTHOR CONFIG_PWM_ROCKCHIP CONFIG_SENSORS_PWM_FAN \
                     CONFIG_ROCKCHIP_THERMAL CONFIG_MODULES; do
              grep -q "^${s}=y$" "${kcfg}" || { echo "::error::kernel ${s} is not =y in the image build"; fail=1; }
            done
            grep -qE '^CONFIG_DRM_ACCEL_ROCKET=(y|m)$' "${kcfg}" && {
              echo "::error::CONFIG_DRM_ACCEL_ROCKET is enabled in the image kernel; it would bind the rknn-core DT nodes instead of rknpu.ko"; fail=1; }
            echo "--- rknpu.ko (out-of-tree NPU module) ---"
            ls -la /mnt/output/build/rknpu-*/rknpu.ko 2>/dev/null \
              || { echo "::error::rknpu.ko was not built"; fail=1; }
            ls -la /mnt/output/target/lib/modules/*/kernel/drivers/*rknpu* 2>/dev/null \
              || find /mnt/output/target/lib/modules -name 'rknpu*.ko*' -print \
              || { echo "::error::rknpu.ko was not installed into the target rootfs"; fail=1; }
          fi
          if [ "${want_img}" = 1 ]; then
            ls -la /mnt/output/images/ || true
            compgen -G '/mnt/output/images/haos_*' > /dev/null \
              || { echo "::error::no haos_* image was produced in output/images"; fail=1; }
          fi
          exit "${fail}"

      - name: Check Linux kernel config
        if: env.STAGE == 'full'
        run: |
          set +e
          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" -e BUILDER_GID="$(id -g)" \
            -v "${BUILD_TREE}:/build" -v /mnt/cache:/cache -v /mnt/output:/build/output \
            haos-builder:local \
            make BR2_CHECK_DOTCONFIG_OPTS="--github-format --strip-path-prefix=/build/" \
              linux-check-dotconfig 2>&1 | tee /tmp/dotconfig.log
          rc=${PIPESTATUS[0]}
          # check-dotconfig.py only emits ::warning:: lines, so a non-zero rc here is
          # a real problem (unreadable fragment/config), not a config diff.
          if [ "${rc}" -ne 0 ]; then
            echo "::error::linux-check-dotconfig failed with rc=${rc}"
            exit 1
          fi

      - name: List and checksum the images
        if: env.STAGE == 'full'
        run: |
          set -euo pipefail
          ls -la /mnt/output/images/
          cd /mnt/output/images/
          if ! compgen -G 'haos_rock5b-*.img.xz' > /dev/null; then
            echo "::error::no haos_rock5b-*.img.xz was produced in output/images (the board hook runs convert_disk_image_xz)"
            exit 1
          fi
          sha256sum haos_rock5b-*.img.xz > SHA256SUMS.rock5b
          cat SHA256SUMS.rock5b
          du -h haos_rock5b-*.img.xz

      - name: Publish the image to the rock5b-dev release
        if: env.STAGE == 'full'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rock5b-dev
          name: Rock 5B (RK3588) development images
          body: |
            Self-signed development images for the Radxa Rock 5B, built by the
            `Rock 5B image build` workflow from branch `${{ github.ref_name }}`
            (commit `${{ github.sha }}`). Not OTA-updatable to a signed release.
          prerelease: true
          files: |
            /mnt/output/images/haos_rock5b-*.img.xz
            /mnt/output/images/SHA256SUMS.rock5b

      - name: Upload image artifact
        if: env.STAGE == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: haos_rock5b-image
          path: |
            /mnt/output/images/haos_rock5b-*.img.xz
            /mnt/output/images/SHA256SUMS.rock5b
          retention-days: 7
          if-no-files-found: error

      - name: Save ccache
        if: always() && env.STAGE != 'config'
        uses: actions/cache/save@v6
        with:
          path: /mnt/cache/cc
          key: haos-cc-rock5b-${{ github.run_id }}

      - name: Upload build logs (for debugging)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rock5b-image-logs
          path: |
            /mnt/output/.config
            /tmp/build.log
            /tmp/dotconfig.log
            /tmp/docker-build.log
          retention-days: 7
          if-no-files-found: ignore
