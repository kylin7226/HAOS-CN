name: Rootfs diff analysis (test)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target with a matching official comparison image'
        required: false
        type: choice
        options:
          - generic_x86_64
        default: 'generic_x86_64'
      upstream_ref:
        description: 'Official release tag to build and compare'
        required: false
        default: '18.5'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TARGET: ${{ inputs.target || 'generic_x86_64' }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || '18.5' }}
    steps:
      - name: Validate comparison inputs
        run: |
          [[ "${TARGET}" = generic_x86_64 && "${UPSTREAM_REF}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo '::error::Analysis requires generic_x86_64 and an official release tag; Rock 5B has no matching official image.'
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout private repo
        uses: actions/checkout@v7
        with:
          repository: desmond-dong/haos-cn-scripts
          token: ${{ secrets.GH_PAT }}
          path: private

      - name: Free up disk space
        run: |
          chmod +x private/*.sh
          sudo private/release_space.sh
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Clone upstream and apply CN overlay
        run: |
          git clone --depth 1 --branch "${UPSTREAM_REF}" https://github.com/home-assistant/operating-system.git operating-system
          cp -r buildroot-external operating-system
          cd operating-system
          git submodule update --init
          # 验证:1) 不对 buildroot 做 sed(避免 -dirty) 2) 清除 buildroot tag(让 gcc 版本串与官方等长)
          git -C buildroot tag -l | xargs -r git -C buildroot tag -d >/dev/null
          sed -i 's|^FallbackNTP=time.cloudflare.com$|FallbackNTP=cn.ntp.org.cn time.windows.com|' buildroot-external/rootfs-overlay/etc/systemd/timesyncd.conf
          # 测试变体:禁用 ccache,验证内核模块 .comment 混链消失
          sed -i '/^BR2_CCACHE=y$/d' buildroot-external/configs/*_defconfig

      - name: Run private build script
        run: |
          chmod +x private/*.sh
          private/haos.sh
        env:
          MATRIX_TARGET: ${{ inputs.target }}
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}

      - name: Restore official hassio source for CI (analysis only)
        run: |
          # hasscn.top 镜像源在 CI 上拉 supervisor blob 持续 EOF;runner 在海外,
          # 分析构建直接用官方源。supervisor 镜像只进 data 分区,不影响 rootfs 对比。
          cd operating-system
          sed -i 's|ghcr.hasscn.top/ha-china|ghcr.io/home-assistant|g' buildroot-external/package/hassio/dind-import-containers.sh buildroot-external/rootfs-overlay/usr/sbin/haos-supervisor
          sed -i 's|version.hasscn.top|version.home-assistant.io|g' buildroot-external/package/hassio/hassio.mk buildroot-external/rootfs-overlay/usr/sbin/haos-supervisor

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        shell: 'script -q -e -c "bash {0}"'
        env:
          CACHE_DIR: /mnt/cache
        run: |
          cd operating-system
          scripts/enter.sh make "${TARGET}"

      - name: Diff our rootfs against official release
        if: always()
        run: |
          set -euo pipefail
          IMG=operating-system/output/images/rootfs.erofs
          HOSTBIN=operating-system/output/host/bin
          if [ ! -f "$IMG" ] || [ ! -x "$HOSTBIN/fsck.erofs" ]; then
            echo "rootfs.erofs or fsck.erofs missing, cannot analyze"
            exit 0
          fi
          mkdir -p analysis
          TAG="${UPSTREAM_REF}"
          echo "official release: $TAG"
          curl -sfL -o /tmp/official.raucb "https://github.com/home-assistant/operating-system/releases/download/${TAG}/haos_generic-x86-64-${TAG}.raucb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          unsquashfs -n -d /tmp/official_extract /tmp/official.raucb rootfs.img >/dev/null
          OFFICIAL=/tmp/official_extract/rootfs.img
          rm -rf /tmp/off_tree /tmp/our_tree
          "$HOSTBIN/fsck.erofs" --extract=/tmp/off_tree "$OFFICIAL"
          "$HOSTBIN/fsck.erofs" --extract=/tmp/our_tree "$IMG"
          (cd /tmp/off_tree && find . -type f -printf '%s\t%p\n' | sort -k2) > analysis/official_files.txt
          (cd /tmp/our_tree && find . -type f -printf '%s\t%p\n' | sort -k2) > analysis/our_files.txt
          python3 - <<'EOF' | tee analysis/report.txt
          import hashlib
          from pathlib import Path
          def load(p, root):
              d = {}
              for line in open(p, encoding='utf-8', errors='replace'):
                  parts = line.rstrip('\n').split('\t', 1)
                  if len(parts) == 2:
                      digest = hashlib.sha256()
                      with (Path(root) / parts[1]).open('rb') as stream:
                          for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                              digest.update(chunk)
                      d[parts[1]] = (int(parts[0]), digest.hexdigest())
              return d
          off = load('analysis/official_files.txt', '/tmp/off_tree')
          our = load('analysis/our_files.txt', '/tmp/our_tree')
          print(f'official: {len(off)} files, {sum(v[0] for v in off.values()):,} bytes (raw)')
          print(f'ours:     {len(our)} files, {sum(v[0] for v in our.values()):,} bytes (raw)')
          only_our = {k: our[k][0] for k in our.keys() - off.keys()}
          only_off = {k: off[k][0] for k in off.keys() - our.keys()}
          changed = {k: (off[k][0], our[k][0]) for k in off.keys() & our.keys() if off[k] != our[k]}
          print(f'\n== files only in OURS ({len(only_our)}) ==')
          for k, v in sorted(only_our.items(), key=lambda x: -x[1]):
              print(f'  +{v:>10,}  {k}')
          print(f'\n== files only in OFFICIAL ({len(only_off)}) ==')
          for k, v in sorted(only_off.items(), key=lambda x: -x[1]):
              print(f'  -{v:>10,}  {k}')
          print(f'\n== files with different content ({len(changed)}) ==')
          tot = 0
          for k, (a, b) in sorted(changed.items(), key=lambda x: -(x[1][1] - x[1][0])):
              d = b - a
              tot += d
              print(f'  {d:>+12,}  {k}  (official {a:,} -> ours {b:,})')
          print(f'\nnet raw delta from changed files: {tot:+,}')
          EOF
          # 深挖:对比差异最大的内核模块的 ELF section 表与 .comment 内容(编译器版本字符串)
          KO_REL=$(find /tmp/our_tree/usr/lib/modules -path '*/kernel/drivers/gpu/drm/amd/amdgpu/amdgpu.ko' -printf 'usr/lib/modules/%P\n' -quit)
          if [ -f /tmp/off_tree/$KO_REL ] && [ -f /tmp/our_tree/$KO_REL ]; then
            readelf -S /tmp/off_tree/$KO_REL > analysis/official_amdgpu_sections.txt 2>&1 || true
            readelf -S /tmp/our_tree/$KO_REL > analysis/our_amdgpu_sections.txt 2>&1 || true
            diff -u analysis/official_amdgpu_sections.txt analysis/our_amdgpu_sections.txt > analysis/amdgpu_sections.diff || true
            {
              echo "=== .comment strings (official) ==="
              readelf -p .comment /tmp/off_tree/$KO_REL 2>&1 || true
              echo "=== .comment strings (ours) ==="
              readelf -p .comment /tmp/our_tree/$KO_REL 2>&1 || true
            } > analysis/amdgpu_comment.txt || true
            tail -c 4096 /tmp/off_tree/$KO_REL | xxd > analysis/official_amdgpu_tail.txt 2>/dev/null || true
            tail -c 4096 /tmp/our_tree/$KO_REL | xxd > analysis/our_amdgpu_tail.txt 2>/dev/null || true
          fi

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-analysis
          path: |
            analysis/
            operating-system/output/images/rootfs.erofs
          retention-days: 5
          if-no-files-found: ignore
