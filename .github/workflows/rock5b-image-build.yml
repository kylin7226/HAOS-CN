name: Rock 5B image build

# Full builds require persistent signing secrets; earlier stages need no private repository.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Build stage'
        required: true
        type: choice
        default: config
        options:
          - config
          - packages
          - kernel
          - full
      upstream_ref:
        description: 'Upstream ref (empty = latest stable for stable channel, 18.5 for dev)'
        required: false
        type: string
      channel:
        description: 'Release channel (stable always builds the full image)'
        type: choice
        default: dev
        options: [dev, stable]
  workflow_call:
    inputs:
      stage:
        type: string
        default: full
      upstream_ref:
        type: string
        default: ''
      channel:
        type: string
        default: stable
      overlay_ref:
        type: string
        required: true
    secrets:
      RAUC_CERTIFICATE:
        required: true
      RAUC_PRIVATE_KEY:
        required: true
  push:
    branches: [rock5b-port]
    paths:
      - 'buildroot-external/**'
      - '.github/workflows/rock5b-image-build.yml'
      - '.github/scripts/**'
      - '.github/tests/**'

concurrency:
  group: rock5b-image-${{ (inputs.channel == 'stable' || contains(github.event.head_commit.message, '[release:stable]')) && 'stable' || github.ref }}
  cancel-in-progress: ${{ inputs.channel != 'stable' && !contains(github.event.head_commit.message, '[release:stable]') }}

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/home-assistant/operating-system.git

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.stable.outputs.build || steps.selection.outputs.build }}
      channel: ${{ steps.selection.outputs.channel }}
      stage: ${{ steps.selection.outputs.stage }}
      upstream_ref: ${{ steps.stable.outputs.upstream_ref || steps.selection.outputs.upstream_ref }}
      upstream_sha: ${{ steps.stable.outputs.upstream_sha }}
      release_tag: ${{ steps.stable.outputs.release_tag }}
      overlay_sha: ${{ steps.selection.outputs.overlay_sha }}
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.overlay_ref || github.sha }}

      - name: Select build channel
        id: selection
        env:
          CHANNEL: ${{ inputs.channel || (contains(github.event.head_commit.message, '[release:stable]') && 'stable' || 'dev') }}
          STAGE: ${{ inputs.stage || (contains(github.event.head_commit.message, '[stage:packages]') && 'packages' || contains(github.event.head_commit.message, '[stage:kernel]') && 'kernel' || contains(github.event.head_commit.message, '[stage:full]') && 'full' || contains(github.event.head_commit.message, '[full]') && 'full' || 'config') }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          PUSH_MESSAGE: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          case "${CHANNEL}" in
            stable)
              STAGE=full
              if [ -z "${UPSTREAM_REF}" ] && [[ "${PUSH_MESSAGE}" =~ \[upstream:([0-9]+\.[0-9]+(\.[0-9]+)?)\] ]]; then
                UPSTREAM_REF="${BASH_REMATCH[1]}"
              fi
              ;;
            dev) UPSTREAM_REF="${UPSTREAM_REF:-18.5}" ;;
            *) echo '::error::Unknown release channel'; exit 1 ;;
          esac
          case "${STAGE}" in
            config|packages|kernel|full) ;;
            *) echo '::error::Unknown build stage'; exit 1 ;;
          esac
          [[ "${UPSTREAM_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ || -z "${UPSTREAM_REF}" ]] || {
            echo '::error::Invalid upstream ref'; exit 1;
          }
          {
            echo "channel=${CHANNEL}"
            echo "stage=${STAGE}"
            echo "upstream_ref=${UPSTREAM_REF}"
            echo "overlay_sha=$(git rev-parse HEAD)"
            [ "${CHANNEL}" != dev ] || echo 'build=true'
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve official release and skip completed builds
        id: stable
        if: steps.selection.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ steps.selection.outputs.upstream_ref }}
        run: python3 .github/scripts/resolve-rock5b-release.py

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: Rock 5B ${{ needs.prepare.outputs.channel }} ${{ needs.prepare.outputs.upstream_ref }} (${{ needs.prepare.outputs.stage }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      STAGE: ${{ needs.prepare.outputs.stage }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      OVERLAY_SHA: ${{ needs.prepare.outputs.overlay_sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout HAOS-CN
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OVERLAY_SHA }}

      - name: Run local regression checks
        run: python3 -m unittest discover -s .github/tests -v

      - name: Free up disk space
        run: |
          set -euo pipefail
          df -h
          # The full stage assembles the rootfs plus a ~2 GB disk image and its xz on
          # top of the whole Buildroot output tree -- the peak-disk stage -- so reclaim
          # as much as possible. None of these are used by the containerised HAOS
          # build. Swap is deliberately left enabled: disabling it to reclaim
          # /swapfile would risk OOM during the multi-hour build.
          sudo rm -rf /usr/local/lib/android/sdk /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet /usr/local/share/boost
          sudo mkdir -p /mnt/cache /mnt/output
          owner="$(stat -c '%U:%G' "${GITHUB_WORKSPACE}")"
          sudo chown -R "${owner}" /mnt/cache /mnt/output
          df -h

      - name: Assemble the build tree
        run: |
          set -euo pipefail
          # Upstream provides the buildroot submodule, scripts/, ota/, meta and the
          # upstream packages; this fork overlays its buildroot-external on top,
          # exactly like HAOS-CN's Builder.yml does (cp -r buildroot-external ...).
          git clone --quiet --depth 1 --branch "${UPSTREAM_REF}" "${UPSTREAM_REPO}" os-up
          if [ "${CHANNEL}" = stable ] && [ "$(git -C os-up rev-parse HEAD)" != "${UPSTREAM_SHA}" ]; then
            echo '::error::Upstream release tag moved after detection; refusing to build'; exit 1
          fi
          git -C os-up submodule update --init --depth 1
          cp -a buildroot-external/. os-up/buildroot-external/
          if [ "${CHANNEL}" = stable ]; then
            python3 .github/scripts/sync-rock5b-upstream.py os-up
          fi
          for f in external.desc external.mk Config.in scripts/post-image.sh \
                   configs/rock5b_defconfig kernel/v6.18.y/kernel-arm64-rockchip.config \
                   board/radxa/rock5b/meta Dockerfile; do
            test -f "os-up/buildroot-external/${f}" 2>/dev/null || test -f "os-up/${f}" || {
              echo "::error::build tree is missing ${f}"; exit 1; }
          done
          echo "BUILD_TREE=${GITHUB_WORKSPACE}/os-up" >> "${GITHUB_ENV}"

      - name: Set image version and release tags
        run: |
          set -euo pipefail
          cd "${BUILD_TREE}"
          if [ "${CHANNEL}" = stable ]; then
            git show HEAD:buildroot-external/meta > buildroot-external/meta
            . buildroot-external/meta
            version="${VERSION_MAJOR}.${VERSION_MINOR}${VERSION_SUFFIX:+.${VERSION_SUFFIX}}"
            if [ "${version}" != "${UPSTREAM_REF}" ]; then
              echo '::error::Official release metadata does not match its tag'; exit 1
            fi
          else
            version_dev="dev${GITHUB_RUN_ID}$(printf '%04d' "${GITHUB_RUN_ATTEMPT}")"
            sed -i -E "s/(^VERSION_SUFFIX=\").*(\"$)/\1${version_dev}\2/" buildroot-external/meta
          fi
          echo "HISTORY_TAG=v$(date --utc +'%Y.%m.%d')-rock5b.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"
          grep '^VERSION' buildroot-external/meta

      - name: Prepare persistent RAUC signing key
        if: env.STAGE == 'full'
        env:
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        run: bash .github/scripts/prepare-rauc-signing.sh "${BUILD_TREE}"

      - name: Build the haos-builder container image
        run: |
          set -euo pipefail
          cd "${BUILD_TREE}"
          docker build -t haos-builder:local . > /tmp/docker-build.log 2>&1 || {
            echo "::error::haos-builder image build failed:"; tail -n 40 /tmp/docker-build.log; exit 1; }
          tail -n 5 /tmp/docker-build.log

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: /mnt/cache/cc
          key: haos-cc-rock5b
          restore-keys: haos-cc-rock5b-

      - name: Generate build config (make rock5b_defconfig)
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" -e BUILDER_GID="$(id -g)" \
            -v "${BUILD_TREE}:/build" -v /mnt/cache:/cache -v /mnt/output:/build/output \
            haos-builder:local make rock5b_defconfig
          test -f /mnt/output/.config

      - name: Audit the resolved Buildroot config
        run: |
          set -uo pipefail
          cfg=/mnt/output/.config
          fail=0
          echo "--- board / image plumbing ---"
          for s in BR2_aarch64 BR2_LINUX_KERNEL BR2_PACKAGE_HOST_GENIMAGE BR2_TARGET_UBOOT \
                   BR2_PACKAGE_ROCKCHIP_BLOBS BR2_PACKAGE_HASSIO BR2_PACKAGE_OS_AGENT \
                   BR2_PACKAGE_RAUC; do
            grep -q "^${s}=y$" "${cfg}" || { echo "::error::${s} is not enabled ($(grep "^${s}=" "${cfg}" || echo unset))"; fail=1; }
          done
          if grep -q '^BR2_PACKAGE_LIBRKNNRT=y$' "${cfg}"; then
            echo "::error::Host librknnrt must remain optional; containers provide the runtime"
            fail=1
          fi
          echo "--- RK3588 media/AI packages ---"
          # Mandatory (kernel side): the rknpu out-of-tree module and the kernel
          # itself. The MPP/RGA drivers, Panthor (GPU) and pwm-fan + thermal
          # (fan control) are compiled INTO the kernel by
          # board/radxa/rock5b/kernel.config, so there is no package for them.
          for s in BR2_PACKAGE_RKNPU BR2_PACKAGE_LINUX_FIRMWARE_ARM_MALI_CSF BR2_LINUX_KERNEL; do
            grep -q "^${s}=y$" "${cfg}" || {
              echo "::error::Required driver or firmware configuration ${s} was dropped"; fail=1; }
          done
          # Userspace accelerators: nice to have, containers can bring their own
          # (see the board kernel.config note), so a drop is a warning, not an error.
          for s in BR2_PACKAGE_ROCKCHIP_MPP BR2_PACKAGE_LIBRGA BR2_PACKAGE_FFMPEG_ROCKCHIP; do
            if grep -q "^${s}=y$" "${cfg}"; then
              echo "ok    ${s}=y"
            else
              echo "::warning::${s} was dropped: it is set in configs/rock5b_defconfig but missing from the resolved .config (Config.in not sourced, unmet dependency, or stale symbol). Containers can provide this userspace instead."
            fi
          done
          echo "--- known-unavailable HAOS-CN symbols (private packages, tolerated) ---"
          for s in BR2_PACKAGE_RTL8821CU; do
            grep -q "^${s}=y$" "${cfg}" || echo "::warning::${s}=y is requested by rock5b_defconfig but not set (private HAOS-CN package, absent from this self-contained tree)"
          done
          echo "--- kernel config chain ---"
          grep -E '^BR2_LINUX_KERNEL_(CUSTOM_VERSION_VALUE|CUSTOM_CONFIG_FILE|CONFIG_FRAGMENT_FILES|INTREE_DTS_NAME)=' "${cfg}" || true
          grep -q '^BR2_LINUX_KERNEL_INTREE_DTS_NAME="rockchip/rk3588-rock-5b"$' "${cfg}" || {
            echo "::error::kernel DTB name is not rockchip/rk3588-rock-5b"; fail=1; }
          exit "${fail}"

      - name: Build stage '${{ env.STAGE }}'
        if: env.STAGE != 'config'
        run: |
          set +e
          : > /tmp/build.log
          case "${STAGE}" in
            # Cumulative: each stage re-lists the prior stages' targets so Buildroot
            # rebuilds them ccache-warm (only /mnt/cache/cc persists between runs, not
            # the output/ stamps). The kernel stage is the first to compile the
            # mandatory out-of-tree rknpu.ko against the image kernel.
            packages) targets="rockchip-mpp librga ffmpeg-rockchip hassio host-tempio os-agent" ;;
            kernel)   targets="rockchip-mpp librga ffmpeg-rockchip hassio host-tempio os-agent linux rknpu" ;;
            full)     targets="" ;;
            *) echo "::error::unknown stage '${STAGE}'"; exit 1 ;;
          esac
          echo "stage=${STAGE} make targets: ${targets:-<all>}"
          # shellcheck disable=SC2086
          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" -e BUILDER_GID="$(id -g)" \
            -v "${BUILD_TREE}:/build" -v /mnt/cache:/cache -v /mnt/output:/build/output \
            haos-builder:local bash -c "cd /build && make ${targets}" 2>&1 | tee -a /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "${rc}" -ne 0 ]; then
            echo "::error::Buildroot build FAILED at stage '${STAGE}' (rc=${rc}). The failing package and its real output are re-emitted below and kept in the build-log artifact."
            # Parallel `make` interleaves a concurrent package's wget progress
            # ("12345K .... 98% 109M") right before the dying package's error, so a
            # raw 90-line window is pure download noise. Two-step instead:
            #   1. Name the failing package from the "*** [output/build/<pkg>/.stamp_*] Error N"
            #      target line (Buildroot's pkg-generic stamps carry the package dir).
            #   2. Show that package's own output: every log line mentioning its build
            #      dir, with download-progress lines stripped.
            failpkg=$(grep -oE 'output/build/[A-Za-z0-9_.+-]+/\.stamp_[A-Za-z_]+' /tmp/build.log | tail -n 1)
            if [ -n "${failpkg}" ]; then
              pkgdir=$(echo "${failpkg}" | sed -E 's#output/build/([^/]+)/.*#\1#')
              echo "::error::Failing package: ${pkgdir} (target ${failpkg})"
              echo "===== lines mentioning ${pkgdir} (progress noise stripped) ====="
              grep -F "${pkgdir}" /tmp/build.log \
                | grep -vE '[0-9]+K \.+|[0-9]+% +[0-9.]+[KMG]' \
                | tail -n 80 | while IFS= read -r l; do echo "::error::${l}"; done
            fi
            # The pkgdir grep above misses root-cause lines that do not name the
            # build dir (e.g. "cp: cannot stat '/cache/dl/librknnrt.so'", wget
            # failures, "No space left on device", hash mismatches). The job log and
            # the build-log artifact both require auth to read on this fork, so
            # re-emit the real error lines as public annotations too.
            echo "===== real error lines (public, keyword-matched) ====="
            grep -vE '[0-9]+K \.+|[0-9]+% +[0-9.]+[KMG]' /tmp/build.log \
              | grep -iE 'cannot stat|No such file|No space left|wget:|ERROR:|[Hh]ash|checksum|Permission denied|tar:|Error [0-9]|\*\*\*|fatal|[Ff]ailed' \
              | tail -n 40 | while IFS= read -r l; do echo "::error::${l}"; done
            # Always also show the make error lines and a noise-stripped tail so the
            # actual compiler/linker failure is visible even if the stamp grep misses.
            echo "===== make error lines ====="
            grep -nE '\*\*\* \[|make(\[[0-9]+\])?: \*\*\*|Error [0-9]+$' /tmp/build.log \
              | grep -vE '[0-9]+K \.+|[0-9]+% +[0-9.]+[KMG]' | tail -n 20
            echo "===== build.log tail (noise-stripped, 120 lines) ====="
            grep -vE '[0-9]+K \.+|[0-9]+% +[0-9.]+[KMG]' /tmp/build.log | tail -n 120
            exit 1
          fi
          echo "Stage '${STAGE}' finished OK"

      - name: Assert stage artifacts
        if: env.STAGE != 'config'
        run: |
          set -uo pipefail
          fail=0
          want_kernel=0; want_img=0
          case "${STAGE}" in
            kernel|full) want_kernel=1 ;;
          esac
          [ "${STAGE}" = full ] && want_img=1
          if [ "${want_kernel}" = 1 ]; then
            for f in /mnt/output/build/linux-*/arch/arm64/boot/Image \
                     /mnt/output/build/linux-*/arch/arm64/boot/dts/rockchip/rk3588-rock-5b.dtb; do
              ls -la ${f} 2>/dev/null || { echo "::error::missing kernel artifact: ${f}"; fail=1; }
            done
            # The kernel-side pieces the port must ship: vendor MPP/RGA built in,
            # Panthor GPU, pwm-fan + thermal, and Rocket kept off for rknpu.
            kcfg=$(echo /mnt/output/build/linux-*/.config | awk '{print $1}')
            for s in CONFIG_ROCKCHIP_MPP_SERVICE CONFIG_ROCKCHIP_MPP_RKVENC2 \
                     CONFIG_ROCKCHIP_MPP_RKVDEC2 CONFIG_ROCKCHIP_MULTI_RGA \
                     CONFIG_DRM_PANTHOR CONFIG_PWM_ROCKCHIP CONFIG_SENSORS_PWM_FAN \
                     CONFIG_ROCKCHIP_THERMAL CONFIG_MODULES; do
              grep -q "^${s}=y$" "${kcfg}" || { echo "::error::kernel ${s} is not =y in the image build"; fail=1; }
            done
            grep -qE '^CONFIG_DRM_ACCEL_ROCKET=(y|m)$' "${kcfg}" && {
              echo "::error::CONFIG_DRM_ACCEL_ROCKET is enabled in the image kernel; it would bind the rknn-core DT nodes instead of rknpu.ko"; fail=1; }
            echo "--- rknpu.ko (out-of-tree NPU module) ---"
            ls -la /mnt/output/build/rknpu-*/rknpu.ko 2>/dev/null \
              || { echo "::error::rknpu.ko was not built"; fail=1; }
            if ! module=$(find /mnt/output/target/lib/modules -type f -name 'rknpu.ko*' -print -quit) || [ -z "${module}" ]; then
              echo "::error::rknpu.ko was not installed into the target rootfs"
              fail=1
            fi
          fi
          if [ "${want_img}" = 1 ]; then
            if ! firmware=$(find /mnt/output/target -path '*/firmware/arm/mali/arch*/mali_csffw.bin' -type f -print -quit) || [ -z "${firmware}" ]; then
              echo "::error::Panthor CSF firmware is missing from the rootfs"
              fail=1
            fi
            ls -la /mnt/output/images/ || true
            compgen -G '/mnt/output/images/haos_*' > /dev/null \
              || { echo "::error::no haos_* image was produced in output/images"; fail=1; }
            compgen -G '/mnt/output/images/haos_rock5b-*.raucb' > /dev/null \
              || { echo "::error::no haos_rock5b-*.raucb OTA bundle was produced in output/images"; fail=1; }
          fi
          exit "${fail}"

      - name: Check Linux kernel config
        if: env.STAGE == 'full'
        run: |
          set +e
          docker run --rm --privileged \
            -e BUILDER_UID="$(id -u)" -e BUILDER_GID="$(id -g)" \
            -v "${BUILD_TREE}:/build" -v /mnt/cache:/cache -v /mnt/output:/build/output \
            haos-builder:local \
            make BR2_CHECK_DOTCONFIG_OPTS="--github-format --strip-path-prefix=/build/" \
              linux-check-dotconfig 2>&1 | tee /tmp/dotconfig.log
          rc=${PIPESTATUS[0]}
          # check-dotconfig.py only emits ::warning:: lines, so a non-zero rc here is
          # a real problem (unreadable fragment/config), not a config diff.
          if [ "${rc}" -ne 0 ]; then
            echo "::error::linux-check-dotconfig failed with rc=${rc}"
            exit 1
          fi

      - name: List and checksum the images
        if: env.STAGE == 'full'
        run: |
          set -euo pipefail
          ls -la /mnt/output/images/
          cd /mnt/output/images/
          if ! compgen -G 'haos_rock5b-*.img.xz' > /dev/null; then
            echo "::error::no haos_rock5b-*.img.xz was produced in output/images (the board hook runs convert_disk_image_xz)"
            exit 1
          fi
          if ! compgen -G 'haos_rock5b-*.raucb' > /dev/null; then
            echo "::error::no haos_rock5b-*.raucb was produced in output/images (genimage should bundle the RAUC OTA image)"
            exit 1
          fi
          if [ "${CHANNEL}" = stable ]; then
            test -s "haos_rock5b-${UPSTREAM_REF}.img.xz"
            test -s "haos_rock5b-${UPSTREAM_REF}.raucb"
          fi
          {
            printf 'overlay_commit=%s\nupstream_ref=%s\n' "${OVERLAY_SHA}" "${UPSTREAM_REF}"
            printf 'channel=%s\n' "${CHANNEL}"
            grep -E '^BR2_(LINUX_KERNEL|TARGET_UBOOT)_CUSTOM_VERSION_VALUE=' /mnt/output/.config
            printf 'upstream_commit=%s\n' "$(git -C "${BUILD_TREE}" rev-parse HEAD)"
            printf 'buildroot_commit=%s\n' "$(git -C "${BUILD_TREE}/buildroot" rev-parse HEAD)"
            printf 'run_id=%s\nrun_attempt=%s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
            openssl x509 -in "${BUILD_TREE}/cert.pem" -noout -sha256 -fingerprint -enddate
          } > build-info.txt
          sha256sum haos_rock5b-*.img.xz haos_rock5b-*.raucb build-info.txt > SHA256SUMS.rock5b
          cat SHA256SUMS.rock5b
          du -h haos_rock5b-*.img.xz haos_rock5b-*.raucb

      - name: Preserve a historical release
        if: env.STAGE == 'full'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.HISTORY_TAG }}
          target_commitish: ${{ env.OVERLAY_SHA }}
          name: Rock 5B ${{ env.HISTORY_TAG }}
          body: |
            Historical Rock 5B ${{ env.CHANNEL }} build from `${{ env.OVERLAY_SHA }}` against HAOS `${{ env.UPSTREAM_REF }}`.
            OTA requires compatible `haos-rock5b` and trust in the signing certificate recorded in `build-info.txt`.
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            /mnt/output/images/haos_rock5b-*.img.xz
            /mnt/output/images/haos_rock5b-*.raucb
            /mnt/output/images/SHA256SUMS.rock5b
            /mnt/output/images/build-info.txt

      - name: Publish the image to the channel release
        if: env.STAGE == 'full'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rock5b-${{ env.CHANNEL }}
          target_commitish: ${{ env.OVERLAY_SHA }}
          name: Rock 5B (RK3588) ${{ env.CHANNEL }} images
          body: |
            Community Rock 5B ${{ env.CHANNEL }} images based on HAOS `${{ env.UPSTREAM_REF }}`,
            built from overlay commit `${{ env.OVERLAY_SHA }}`.
            This is an unofficial board port, not an official Home Assistant OS board release.

            - `haos_rock5b-*.img.xz` — full disk image, flash to an SD/eMMC for a
              fresh install.
            - `haos_rock5b-*.raucb` — signed RAUC A/B OTA update bundle. The device
              must trust the configured signing certificate and use compatible
              `haos-rock5b`. Images signed with earlier temporary keys need a
              deliberate trust migration or a fresh installation.
            - Signing certificate fingerprint and source revisions: `build-info.txt`.
            - Historical build: `${{ env.HISTORY_TAG }}`.
          prerelease: ${{ env.CHANNEL != 'stable' }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            /mnt/output/images/haos_rock5b-*.img.xz
            /mnt/output/images/haos_rock5b-*.raucb
            /mnt/output/images/SHA256SUMS.rock5b
            /mnt/output/images/build-info.txt

      - name: Publish the versioned stable release
        if: env.STAGE == 'full' && env.CHANNEL == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.OVERLAY_SHA }}
          name: Rock 5B - HAOS ${{ env.UPSTREAM_REF }}
          body: |
            Community Rock 5B image based on official HAOS release `${{ env.UPSTREAM_REF }}`.
            Overlay commit: `${{ env.OVERLAY_SHA }}`. Historical build: `${{ env.HISTORY_TAG }}`.
            This is an unofficial board port; hardware validation is separate from CI build checks.
            The `.img.xz` is for flashing; the `.raucb` is for devices trusting the configured
            persistent signing certificate with RAUC compatible `haos-rock5b`.
            See `SHA256SUMS.rock5b` and `build-info.txt` for checksums and source/signing provenance.
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            /mnt/output/images/haos_rock5b-${{ env.UPSTREAM_REF }}.img.xz
            /mnt/output/images/haos_rock5b-${{ env.UPSTREAM_REF }}.raucb
            /mnt/output/images/SHA256SUMS.rock5b
            /mnt/output/images/build-info.txt

      - name: Upload image artifact
        if: env.STAGE == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: haos_rock5b-image
          path: |
            /mnt/output/images/haos_rock5b-*.img.xz
            /mnt/output/images/haos_rock5b-*.raucb
            /mnt/output/images/SHA256SUMS.rock5b
            /mnt/output/images/build-info.txt
          retention-days: 7
          if-no-files-found: error

      - name: Save ccache
        if: always() && env.STAGE != 'config'
        uses: actions/cache/save@v6
        with:
          path: /mnt/cache/cc
          key: haos-cc-rock5b-${{ github.run_id }}

      - name: Upload build logs (for debugging)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rock5b-image-logs
          path: |
            /mnt/output/.config
            /tmp/build.log
            /tmp/dotconfig.log
            /tmp/docker-build.log
            /mnt/output/build/linux-*/.config
            /mnt/output/build/uboot-*/.config
            /mnt/output/images/build-info.txt
          retention-days: 7
          if-no-files-found: ignore
